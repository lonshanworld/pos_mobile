name: Deploy FastAPI to VPS

on:
  push:
    branches: [ "production" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # BUILD STEP (LOCAL ON GITHUB RUNNER)
      # =========================
      - name: Build package
        run: |
          APP_PATH=mobile-crash-backend

          mkdir -p release

          pip install -r $APP_PATH/requirements.txt -t release

          cp $APP_PATH/main.py release/
          cp $APP_PATH/database.py release/
          cp $APP_PATH/auth.py release/
          cp $APP_PATH/config.py release/

          cp -r $APP_PATH/templates release/

      # =========================
      # PACKAGE
      # =========================
      - name: Create tar archive
        run: tar -czf release.tar.gz release

      # =========================
      # UPLOAD TO VPS
      # =========================
      - name: Upload to VPS
        uses: appleboy/scp-action@master
        with:
          host: 51.79.178.15
          username: root
          port: 12520
          key: ${{ secrets.SSH_KEY }}
          source: "release.tar.gz"
          target: "/opt/crash-backend"

      # =========================
      # DEPLOY ON VPS (FIXED FOR OPENVZ + LOW RAM)
      # =========================
      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: 51.79.178.15
          username: root
          port: 12520
          key: ${{ secrets.SSH_KEY }}
          script: |

            set -e

            cd /opt/crash-backend

            rm -rf current
            mkdir current

            tar -xzf release.tar.gz -C current

            cd current/release

            # safer kill (avoid blocking on OpenVZ VPS)
            pkill -f "uvicorn main:app" || true

            # start FastAPI in fully detached mode
            nohup python3 -m uvicorn main:app \
              --host 0.0.0.0 \
              --port 12500 \
              --log-level warning \
              > backend.log 2>&1 &

            disown

            echo "Deployment completed successfully"